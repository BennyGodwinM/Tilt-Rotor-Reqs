# SysON dev stack: web modeler + PostgreSQL. Models are stored in the database volume;
# the Git repo (models/*.sysml) is the baseline of record.
services:
  syson-db:
    image: postgres:15
    environment:
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: dbpwd
      POSTGRES_DB: syson-db
    volumes:
      - syson-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d syson-db"]
      interval: 5s
      retries: 20
  syson:
    image: eclipsesyson/syson:v2026.11.0
    depends_on:
      syson-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://syson-db:5432/syson-db
      SPRING_DATASOURCE_USERNAME: dbuser
      SPRING_DATASOURCE_PASSWORD: dbpwd
volumes:
  syson-pgdata:
